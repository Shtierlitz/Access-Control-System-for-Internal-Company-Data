// shared/proto/orders.proto
syntax = "proto3";

package order;

message Order {
  int32 id = 1;
  int32 user_id = 2;
  string item_name = 3;
  int32 price = 4;
  string status = 5;
  string created_at = 6;
}

message CreateOrderRequest {
  int32 user_id = 1;
  string item_name = 2;
  int32 price = 3;
}

message OrderResponse {
  Order order = 1;
}

message UserIdRequest {
  int32 user_id = 1;
}

message OrderListResponse {
  repeated Order orders = 1;
}

message Empty {}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc ListOrdersByUser(UserIdRequest) returns (OrderListResponse);
  rpc ListAllOrders(Empty) returns (OrderListResponse);
}
