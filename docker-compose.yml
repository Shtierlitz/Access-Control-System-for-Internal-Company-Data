# =============================
# 📦 docker-compose.yml
# =============================

services:
  db_service:
    build:
      context: .
      dockerfile: db_service/Dockerfile
    env_file:
      - ./db_service/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    env_file:
      - ./user_service/.env
    ports:
      - "8002:8002"
    depends_on:
      - db_service

  postgres_db:
    image: postgres:14
    env_file:
      - .env.postgres
    ports:
      - "5433:5432"  # 5433 наружу, 5432 внутри
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
